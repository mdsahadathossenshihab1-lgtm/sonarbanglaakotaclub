<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>অ্যাডমিন ড্যাশবোর্ড - সোনার বাংলা একতা ক্লাব</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; }
        .modal { transition: opacity 0.25s ease; }
        body.modal-active { overflow-x: hidden; overflow-y: visible !important; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">

    <nav class="bg-red-600 text-white shadow-lg p-4 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold">সোনার বাংলা একতা ক্লাব - অ্যাডমিন প্যানেল</h1>
            <button onclick="location.reload()" class="bg-white/20 hover:bg-white/30 px-4 py-2 rounded-lg text-sm transition">রিফ্রেশ ডাটা</button>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-6 md:p-10">
        <div class="mb-8 flex flex-col sm:flex-row justify-between items-start sm:items-end gap-4">
            <div>
                <h2 class="text-2xl font-bold text-slate-800">নিবন্ধিত সদস্য তালিকা</h2>
                <p class="text-slate-500">মোট সদস্য সংখ্যা: <span id="memberCount" class="font-bold text-red-600">০</span> জন</p>
            </div>
            <input type="text" id="searchInput" onkeyup="searchMembers()" placeholder="নাম বা মোবাইল দিয়ে খুঁজুন..." class="px-4 py-2 border rounded-xl outline-none focus:ring-2 focus:ring-red-500 w-full sm:w-64 shadow-sm">
        </div>

        <div id="memberGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <p id="loadingText" class="col-span-full text-center py-20 text-slate-400 text-lg animate-pulse">ডাটা লোড হচ্ছে, দয়া করে অপেক্ষা করুন...</p>
        </div>
    </main>

    <div id="modal" class="modal opacity-0 pointer-events-none fixed w-full h-full top-0 left-0 flex items-center justify-center z-50">
        <div class="modal-overlay absolute w-full h-full bg-slate-900 opacity-60"></div>
        
        <div class="modal-container bg-white w-11/12 md:max-w-3xl mx-auto rounded-2xl shadow-2xl z-50 overflow-y-auto max-h-[90vh]">
            <div class="p-6">
                <div class="flex justify-between items-center pb-4 border-b">
                    <p class="text-2xl font-bold text-red-600">আবেদনকারীর সম্পূর্ণ বিবরণী</p>
                    <button onclick="toggleModal()" class="text-slate-400 hover:text-slate-600 text-3xl font-semibold">&times;</button>
                </div>
                
                <div id="modalBody" class="py-6">
                    </div>

                <div class="flex justify-end pt-4 border-t gap-3">
                    <button onclick="window.print()" class="px-5 py-2 bg-red-600 text-white rounded-xl font-bold hover:bg-red-700 transition">প্রিন্ট করুন</button>
                    <button onclick="toggleModal()" class="px-5 py-2 bg-slate-800 text-white rounded-xl font-bold hover:bg-slate-700 transition">বন্ধ করুন</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbzO4KYYGquq9HkDRc9ro006RdowrJ5irNg5zePilck_ZGmp6-Jjq2BNjDIph8W-U7Wl5w/exec'; // আপনার Web App URL এখানে দিন
        let allMembers = [];

        async function fetchMembers() {
            try {
                const response = await fetch(scriptURL);
                allMembers = await response.json();
                renderMembers(allMembers);
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('loadingText').innerText = "ডাটা লোড করতে সমস্যা হয়েছে বা কোনো মেম্বার ডাটা নেই।";
            }
        }

        function renderMembers(data) {
            const grid = document.getElementById('memberGrid');
            const count = document.getElementById('memberCount');
            grid.innerHTML = '';
            count.innerText = data.length;

            if(data.length === 0) {
                grid.innerHTML = '<p class="col-span-full text-center py-10 text-slate-400">কোনো সদস্য পাওয়া যায়নি।</p>';
                return;
            }

            data.forEach(user => {
                grid.innerHTML += `
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1">
                        <div class="flex items-center space-x-4">
                            <img src="${user.photo}" class="w-20 h-20 rounded-full object-cover border-2 border-red-100 p-1 bg-slate-50" onerror="this.src='https://via.placeholder.com/150'">
                            <div>
                                <h3 class="font-bold text-slate-800 text-lg">${user.nameBn}</h3>
                                <p class="text-red-600 font-bold text-sm">গ্রুপ: ${user.blood}</p>
                                <p class="text-slate-500 text-xs">${user.phone}</p>
                            </div>
                        </div>
                        <button onclick="viewDetails('${user.phone}')" class="w-full mt-5 bg-slate-50 text-slate-700 font-bold py-2 rounded-xl border border-slate-200 hover:bg-red-600 hover:text-white hover:border-red-600 transition-colors">View Full Details</button>
                    </div>
                `;
            });
        }

        function viewDetails(phone) {
            const user = allMembers.find(u => u.phone.toString().trim() === phone.toString().trim());
            if(!user) return;

            const modalBody = document.getElementById('modalBody');
            modalBody.innerHTML = `
                <div class="flex flex-col items-center mb-6 border-b pb-4">
                    <img src="${user.photo}" class="w-32 h-32 rounded-xl object-cover shadow-md border-4 border-slate-100 mb-3" onerror="this.src='https://via.placeholder.com/150'">
                    <h3 class="text-2xl font-bold text-slate-800">${user.nameBn} (${user.nameEn})</h3>
                    <p class="text-slate-500 font-mono text-sm">ID: MBR-ID-${user.phone.slice(-4)}</p>
                </div>
                
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-100 text-slate-700 text-sm">
                                <th class="p-3 border font-bold">বিষয়</th>
                                <th class="p-3 border font-bold">বিবরণ</th>
                            </tr>
                        </thead>
                        <tbody class="text-sm text-slate-600">
                            <tr><td class="p-3 border font-semibold bg-slate-50/50">পিতার নাম</td><td class="p-3 border">${user.fatherName}</td></tr>
                            <tr><td class="p-3 border font-semibold bg-slate-50/50">মাতার নাম</td><td class="p-3 border">${user.motherName}</td></tr>
                            <tr><td class="p-3 border font-semibold bg-slate-50/50">জন্ম তারিখ</td><td class="p-3 border">${user.dob}</td></tr>
                            <tr><td class="p-3 border font-semibold bg-slate-50/50">রক্তের গ্রুপ</td><td class="p-3 border text-red-600 font-bold">${user.blood}</td></tr>
                            <tr><td class="p-3 border font-semibold bg-slate-50/50">ধর্ম / জাতীয়তা</td><td class="p-3 border">${user.religion} / ${user.nationality}</td></tr>
                            <tr><td class="p-3 border font-semibold bg-slate-50/50">উচ্চতা</td><td class="p-3 border">${user.height}</td></tr>
                            <tr><td class="p-3 border font-semibold bg-slate-50/50">NID / জন্ম নিবন্ধন নম্বর</td><td class="p-3 border font-mono">${user.docIdNumber}</td></tr>
                            <tr><td class="p-3 border font-semibold bg-slate-50/50">সদস্য ফোন নম্বর</td><td class="p-3 border">${user.phone}</td></tr>
                            <tr><td class="p-3 border font-semibold bg-slate-50/50">জরুরী যোগাযোগ নম্বর</td><td class="p-3 border">${user.contactPhone}</td></tr>
                            <tr><td class="p-3 border font-semibold bg-slate-50/50">বর্তমান ঠিকানা</td><td class="p-3 border">${user.presentAddress}</td></tr>
                            <tr><td class="p-3 border font-semibold bg-slate-50/50">স্থায়ী ঠিকানা</td><td class="p-3 border">${user.permanentAddress}</td></tr>
                            <tr><td class="p-3 border font-semibold bg-slate-50/50">শর্তাবলী সম্মতি</td><td class="p-3 border">শর্ত ১: <span class="font-bold">${user.rule1}</span> | শর্ত ২: <span class="font-bold">${user.rule2}</span></td></tr>
                            <tr><td class="p-3 border font-semibold bg-slate-50/50">ডিজিটাল স্বাক্ষর</td><td class="p-3 border class="font-semibold text-slate-800">${user.signatureName}</td></tr>
                            <tr><td class="p-3 border font-semibold bg-slate-50/50">যোগদানের তারিখ</td><td class="p-3 border">${user.joiningDate}</td></tr>
                            <tr>
                                <td class="p-3 border font-semibold bg-slate-50/50">সংলগ্ন ডকুমেন্ট (NID)</td>
                                <td class="p-3 border">
                                    <a href="${user.docLink}" target="_blank" class="text-blue-600 hover:underline inline-flex items-center">NID/সনদ ফাইল দেখুন ↗</a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            `;
            toggleModal();
        }

        function toggleModal() {
            const modal = document.getElementById('modal');
            modal.classList.toggle('opacity-0');
            modal.classList.toggle('pointer-events-none');
            document.body.classList.toggle('modal-active');
        }

        function searchMembers() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allMembers.filter(u => 
                u.nameBn.toLowerCase().includes(term) || 
                u.phone.toString().includes(term)
            );
            renderMembers(filtered);
        }

        fetchMembers();
    </script>
</body>
</html>
