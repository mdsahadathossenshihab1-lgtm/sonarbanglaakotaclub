<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>অ্যাডমিন ড্যাশবোর্ড - সোনার বাংলা একতা ক্লাব</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; }
        .modal { transition: opacity 0.25s ease; }
        body.modal-active { overflow-x: hidden; overflow-y: visible !important; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">

    <!-- Header -->
    <nav class="bg-red-600 text-white shadow-lg p-4 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold">সোনার বাংলা একতা ক্লাব - অ্যাডমিন প্যানেল</h1>
            <button onclick="location.reload()" class="bg-white/20 hover:bg-white/30 px-4 py-2 rounded-lg text-sm transition">রিফ্রেশ ডাটা</button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto p-6 md:p-10">
        <div class="mb-8 flex justify-between items-end">
            <div>
                <h2 class="text-2xl font-bold text-slate-800">নিবন্ধিত সদস্য তালিকা</h2>
                <p class="text-slate-500">মোট সদস্য সংখ্যা: <span id="memberCount" class="font-bold text-red-600">০</span> জন</p>
            </div>
            <input type="text" id="searchInput" onkeyup="searchMembers()" placeholder="নাম বা মোবাইল দিয়ে খুঁজুন..." class="px-4 py-2 border rounded-xl outline-none focus:ring-2 focus:ring-red-500 w-64 shadow-sm">
        </div>

        <!-- Member Grid -->
        <div id="memberGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <!-- মেম্বার কার্ডগুলো এখানে লোড হবে -->
            <p id="loadingText" class="col-span-full text-center py-20 text-slate-400 text-lg animate-pulse">ডাটা লোড হচ্ছে, দয়া করে অপেক্ষা করুন...</p>
        </div>
    </main>

    <!-- Details Modal (পপ-আপ) -->
    <div id="modal" class="modal opacity-0 pointer-events-none fixed w-full h-full top-0 left-0 flex items-center justify-center z-50">
        <div class="modal-overlay absolute w-full h-full bg-slate-900 opacity-50"></div>
        
        <div class="modal-container bg-white w-11/12 md:max-w-2xl mx-auto rounded-2xl shadow-2xl z-50 overflow-y-auto max-h-[90vh]">
            <div class="p-6">
                <div class="flex justify-between items-center pb-4 border-b">
                    <p class="text-2xl font-bold text-red-600">সদস্যের বিস্তারিত তথ্য</p>
                    <button onclick="toggleModal()" class="text-black text-2xl">&times;</button>
                </div>
                
                <div id="modalBody" class="py-6">
                    <!-- বিস্তারিত ডাটা এখানে ইনজেক্ট হবে -->
                </div>

                <div class="flex justify-end pt-2">
                    <button onclick="toggleModal()" class="px-6 py-2 bg-slate-800 text-white rounded-xl font-bold hover:bg-slate-700">বন্ধ করুন</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbyiPjmLGfEnIN-iGTgbMPLgK3U2c4Ws6DsMbTFxmXHS4jveJlJAYqg6eZ-qNlUM6sKO-A/exec'; // আপনার Apps Script URL দিন
        let allMembers = [];

        async function fetchMembers() {
            try {
                const response = await fetch(scriptURL);
                allMembers = await response.json();
                renderMembers(allMembers);
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('loadingText').innerText = "ডাটা লোড করতে সমস্যা হয়েছে।";
            }
        }

        function renderMembers(data) {
            const grid = document.getElementById('memberGrid');
            const count = document.getElementById('memberCount');
            grid.innerHTML = '';
            count.innerText = data.length;

            if(data.length === 0) {
                grid.innerHTML = '<p class="col-span-full text-center py-10 text-slate-400">কোনো সদস্য পাওয়া যায়নি।</p>';
                return;
            }

            data.forEach(user => {
                grid.innerHTML += `
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1">
                        <div class="flex items-center space-x-4">
                            <img src="${user.photo}" class="w-20 h-20 rounded-full object-cover border-2 border-red-100 p-1 bg-slate-50" onerror="this.src='https://via.placeholder.com/150'">
                            <div>
                                <h3 class="font-bold text-slate-800 text-lg">${user.name}</h3>
                                <p class="text-red-600 font-bold text-sm">${user.blood} রক্তদাতা</p>
                                <p class="text-slate-500 text-xs">${user.phone}</p>
                            </div>
                        </div>
                        <button onclick="viewDetails('${user.phone}')" class="w-full mt-5 bg-slate-50 text-slate-700 font-bold py-2 rounded-xl border border-slate-200 hover:bg-red-600 hover:text-white hover:border-red-600 transition-colors">View Full Details</button>
                    </div>
                `;
            });
        }

        function viewDetails(phone) {
            const user = allMembers.find(u => u.phone == phone);
            if(!user) return;

            const modalBody = document.getElementById('modalBody');
            modalBody.innerHTML = `
                <div class="flex flex-col md:flex-row gap-8 items-center md:items-start">
                    <img src="${user.photo}" class="w-40 h-40 rounded-2xl object-cover shadow-lg border-4 border-slate-100">
                    <div class="flex-1 space-y-3 w-full">
                        <div class="bg-red-50 p-3 rounded-lg"><p class="text-sm text-red-600">রক্তের গ্রুপ</p><p class="font-bold text-lg">${user.blood}</p></div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div><p class="text-xs text-slate-500">মোবাইল</p><p class="font-semibold">${user.phone}</p></div>
                            <div><p class="text-xs text-slate-500">ঠিকানা</p><p class="font-semibold">${user.address}</p></div>
                        </div>
                        <hr>
                        <div class="p-3 bg-slate-50 rounded-lg">
                           <p class="text-xs text-slate-500 mb-2">নিবন্ধন আইডি</p>
                           <p class="font-mono text-sm">MBR-ID-${user.phone.slice(-4)}</p>
                        </div>
                    </div>
                </div>
            `;
            toggleModal();
        }

        function toggleModal() {
            const modal = document.getElementById('modal');
            modal.classList.toggle('opacity-0');
            modal.classList.toggle('pointer-events-none');
            document.body.classList.toggle('modal-active');
        }

        function searchMembers() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allMembers.filter(u => 
                u.name.toLowerCase().includes(term) || 
                u.phone.toString().includes(term)
            );
            renderMembers(filtered);
        }

        // পেজ লোড হলে ডাটা আনা শুরু করবে
        fetchMembers();
    </script>
</body>
</html>
