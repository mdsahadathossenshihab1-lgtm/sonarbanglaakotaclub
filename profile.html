<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আমার প্রোফাইল - সোনার বাংলা একতা ক্লাব</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Hind Siliguri', sans-serif; }</style>
</head>
<body class="bg-slate-50 min-h-screen p-4">
    <div class="max-w-lg mx-auto bg-white rounded-3xl shadow-2xl overflow-hidden border mt-10">
        <div class="bg-red-600 h-32 relative"></div>
        <div class="px-8 pb-8">
            <div class="relative -top-16 flex flex-col items-center">
                <img id="userPhoto" src="" class="w-32 h-32 rounded-full border-4 border-white shadow-lg object-cover bg-gray-200">
                <h2 id="userName" class="text-2xl font-bold text-slate-800 mt-4">লোড হচ্ছে...</h2>
                <span id="userBlood" class="bg-red-100 text-red-600 px-4 py-1 rounded-full text-sm font-bold mt-2">রক্তের গ্রুপ: ..</span>
            </div>
            
            <div class="grid grid-cols-1 gap-4 -mt-8">
                <div class="bg-slate-50 p-4 rounded-xl border border-slate-100 text-center">
                    <p class="text-slate-500 text-sm">মোবাইল নম্বর</p>
                    <p id="userPhone" class="font-semibold text-slate-800">...</p>
                </div>
                <div class="bg-slate-50 p-4 rounded-xl border border-slate-100 text-center">
                    <p class="text-slate-500 text-sm">ঠিকানা</p>
                    <p id="userAddress" class="font-semibold text-slate-800">...</p>
                </div>
            </div>

            <div class="mt-8 flex gap-4">
                <button onclick="window.print()" class="flex-1 bg-slate-800 text-white py-3 rounded-xl font-bold">প্রিন্ট / ডাউনলোড</button>
                <button onclick="logout()" class="flex-1 border-2 border-red-600 text-red-600 py-3 rounded-xl font-bold">লগআউট</button>
            </div>
        </div>
    </div>

    <script>
        const user = JSON.parse(localStorage.getItem('userData'));
        if(!user) window.location.href = 'login.html';

        document.getElementById('userName').innerText = user.name;
        document.getElementById('userPhone').innerText = user.phone;
        document.getElementById('userBlood').innerText = "রক্তের গ্রুপ: " + user.blood;
        document.getElementById('userAddress').innerText = user.address;
        document.getElementById('userPhoto').src = user.photo;

        function logout() {
            localStorage.removeItem('userData');
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
