<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>আমার প্রোফাইল - সোনার বাংলা একতা ক্লাব</title>
    
    <link rel="icon" type="image/png" href="https://i.ibb.co.com/spy8c0Q6/file-00000000e6c07208baa6a67b690fa7eb.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen py-12 px-4">

    <div class="max-w-3xl mx-auto bg-white rounded-2xl shadow-2xl overflow-hidden border border-slate-200 relative">
        
        <div class="bg-gradient-to-r from-red-600 to-rose-600 p-6 text-white flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="text-center sm:text-left">
                <h1 class="text-xl font-bold">সোনার বাংলা একতা ক্লাব - সদস্য প্যানেল</h1>
                <p class="text-xs text-red-100">আপনার নিজস্ব প্রোফাইল ও তথ্য সংশোধন কেন্দ্র</p>
            </div>
            <button onclick="logout()" class="bg-white text-red-600 hover:bg-red-50 px-4 py-2 rounded-lg text-xs font-bold transition shadow-md">লগআউট (Logout)</button>
        </div>

        <form id="userUpdateForm" class="p-6 md:p-10 space-y-8">
            <input type="hidden" name="action" value="update">
            <input type="hidden" id="hiddenUserPhone" name="memberPhone">

            <div class="flex flex-col items-center pb-6 border-b border-slate-100">
                <img id="userPhoto" src="" class="w-28 h-28 rounded-full object-cover border-4 border-red-500 shadow-md bg-slate-50" onerror="this.src='https://via.placeholder.com/150'">
                <h3 id="userName" class="text-xl font-bold text-slate-800 mt-3">লোড হচ্ছে...</h3>
                <span id="userBloodDisplay" class="bg-red-50 text-red-600 text-xs px-4 py-1 rounded-full font-bold mt-1">রক্তের গ্রুপ: লোড হচ্ছে..</span>
            </div>

            <div>
                <h2 class="text-base font-bold text-slate-800 mb-4 flex items-center text-red-600">📝 আপনার সম্পূর্ণ প্রোফাইল তথ্য সংশোধন করুন</h2>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5 text-sm">
                    <div>
                        <label class="block font-semibold text-gray-700 mb-1">নাম (বাংলায়)</label>
                        <input type="text" id="uNameBn" name="nameBn" required class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-red-500">
                    </div>
                    <div>
                        <label class="block font-semibold text-gray-700 mb-1">নাম (ইংরেজিতে)</label>
                        <input type="text" id="uNameEn" name="nameEn" required class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-red-500">
                    </div>
                    <div>
                        <label class="block font-semibold text-gray-700 mb-1">পিতার নাম</label>
                        <input type="text" id="uFatherName" name="fatherName" required class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-red-500">
                    </div>
                    <div>
                        <label class="block font-semibold text-gray-700 mb-1">মাতার নাম</label>
                        <input type="text" id="uMotherName" name="motherName" required class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-red-500">
                    </div>
                    <div>
                        <label class="block font-semibold text-gray-700 mb-1">জন্ম তারিখ</label>
                        <input type="text" id="uDob" name="dob" required class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-red-500">
                    </div>
                    <div>
                        <label class="block font-semibold text-gray-700 mb-1">রক্তের গ্রুপ</label>
                        <input type="text" id="uBlood" name="bloodGroup" required class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-red-500">
                    </div>
                    <div>
                        <label class="block font-semibold text-gray-700 mb-1">ধর্ম</label>
                        <input type="text" id="uReligion" name="religion" required class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-red-500">
                    </div>
                    <div>
                        <label class="block font-semibold text-gray-700 mb-1">উচ্চতা</label>
                        <input type="text" id="uHeight" name="height" required class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-red-500">
                    </div>
                    <div>
                        <label class="block font-semibold text-gray-700 mb-1">NID/জন্মসনদ নম্বর</label>
                        <input type="text" id="uDocIdNumber" name="docIdNumber" required class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-red-500">
                    </div>
                    <div>
                        <label class="block font-semibold text-gray-700 mb-1">জরুরী যোগাযোগ নম্বর</label>
                        <input type="text" id="uContactPhone" name="contactPhone" required class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-red-500">
                    </div>
                    <div>
                        <label class="block font-semibold text-gray-700 mb-1">লগইন পাসওয়ার্ড পরিবর্তন করুন</label>
                        <input type="text" id="uPassword" name="password" required class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-red-500 bg-yellow-50/50">
                    </div>
                    <div>
                        <label class="block font-semibold text-gray-700 mb-1">মোবাইল নম্বর (পরিবর্তনযোগ্য নয়)</label>
                        <input type="text" id="uPhoneDisplay" readonly class="w-full p-2.5 border rounded-lg bg-slate-100 cursor-not-allowed text-gray-500">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block font-semibold text-gray-700 mb-1">বর্তমান ঠিকানা</label>
                        <textarea id="uPresentAddress" name="presentAddress" rows="1" required class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-red-500"></textarea>
                    </div>
                    <div class="md:col-span-2">
                        <label class="block font-semibold text-gray-700 mb-1">স্থায়ী ঠিকানা</label>
                        <textarea id="uPermanentAddress" name="permanentAddress" rows="1" required class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-red-500"></textarea>
                    </div>
                </div>
            </div>

            <div class="pt-4 flex flex-col sm:flex-row gap-4">
                <button type="submit" id="saveBtn" class="flex-1 bg-gradient-to-r from-green-600 to-emerald-600 text-white font-bold py-3 rounded-xl shadow-md hover:from-green-700 hover:to-emerald-700 transition active:scale-[0.98]">আমার তথ্য আপডেট করুন</button>
                <button type="button" onclick="window.print()" class="flex-1 bg-slate-800 text-white py-3 rounded-xl font-bold hover:bg-slate-700 transition">প্রিন্ট / ডাউনলোড করুন</button>
            </div>
        </form>
    </div>

    <script>
        // আপনার লেটেস্ট অ্যাপস স্ক্রিপ্ট ওয়েব অ্যাপ URL
        const scriptURL = 'https://script.google.com/macros/s/AKfycbw52A3KWKtYlWJZ92j51unj5wi1011ku_gNzJUGMKoOOrRP1omadWRqZiDMJmK8K_d-Dw/exec';

        // ১. পেজ লোড হওয়ার পর LocalStorage থেকে ডাটা রিড ও চেক করা
        async function loadUserProfile() {
            const loggedInUser = JSON.parse(localStorage.getItem('userData'));
            if (!loggedInUser) {
                window.location.href = 'login.html';
                return;
            }

            try {
                // ডাটাবেজ থেকে লাইভ আপডেটসহ মেম্বারের সমস্ত ২২টি কলামের ডাটা তুলে আনা
                const response = await fetch(scriptURL);
                const allMembers = await response.json();
                const fullUser = allMembers.find(u => u.phone.toString().trim() === loggedInUser.phone.toString().trim());

                if (fullUser) {
                    // ড্যাশবোর্ডের সব ফিল্ডে ডাটা সেট করা
                    document.getElementById('userPhoto').src = fullUser.photo;
                    document.getElementById('userName').innerText = fullUser.nameBn;
                    document.getElementById('userBloodDisplay').innerText = "রক্তের গ্রুপ: " + fullUser.blood;
                    
                    document.getElementById('hiddenUserPhone').value = fullUser.phone;
                    document.getElementById('uPhoneDisplay').value = fullUser.phone;

                    document.getElementById('uNameBn').value = fullUser.nameBn;
                    document.getElementById('uNameEn').value = fullUser.nameEn;
                    document.getElementById('uFatherName').value = fullUser.fatherName;
                    document.getElementById('uMotherName').value = fullUser.motherName;
                    document.getElementById('uDob').value = fullUser.dob;
                    document.getElementById('uBlood').value = fullUser.blood;
                    document.getElementById('uReligion').value = fullUser.religion;
                    document.getElementById('uHeight').value = fullUser.height;
                    document.getElementById('uDocIdNumber').value = fullUser.docIdNumber;
                    document.getElementById('uContactPhone').value = fullUser.contactPhone;
                    document.getElementById('uPassword').value = fullUser.password;
                    document.getElementById('uPresentAddress').value = fullUser.presentAddress;
                    document.getElementById('uPermanentAddress').value = fullUser.permanentAddress;
                } else {
                    alert("আপনার পূর্ণাঙ্গ তথ্য সার্ভারে খুঁজে পাওয়া যায়নি।");
                }
            } catch (error) {
                console.error("Error loading profile:", error);
                // সার্ভার এরর হলে লোকাল ডাটা দিয়ে ব্যাকআপ ফিল করা
                document.getElementById('userName').innerText = loggedInUser.name;
                document.getElementById('uPhoneDisplay').value = loggedInUser.phone;
                document.getElementById('uBlood').value = loggedInUser.blood;
                document.getElementById('userBloodDisplay').innerText = "রক্তের গ্রুপ: " + loggedInUser.blood;
                document.getElementById('uPresentAddress').value = loggedInUser.address;
                document.getElementById('userPhoto').src = loggedInUser.photo;
            }
        }

        // ২. ফর্ম সাবমিট এবং লাইভ গুগল শিট আপডেট হ্যান্ডলার
        document.getElementById('userUpdateForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('saveBtn');
            btn.disabled = true;
            btn.innerText = "তথ্য আপডেট হচ্ছে...";

            const formData = new FormData(e.target);
            const payload = new URLSearchParams(formData);

            try {
                const response = await fetch(scriptURL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: payload.toString()
                });
                const txt = await response.text();
                if(txt === "Updated") {
                    alert("🎉 আপনার তথ্য সফলভাবে গুগল শিটে লাইভ আপডেট করা হয়েছে!");
                    loadUserProfile(); // পেজ ডাটা রি-লোডিং
                } else {
                    alert("❌ তথ্য আপডেট করা যায়নি।");
                }
            } catch (error) {
                console.error(error);
                alert("কারিগরি ত্রুটি বা নেটওয়ার্ক সমস্যা!");
            } finally {
                btn.disabled = false;
                btn.innerText = "আমার তথ্য আপডেট করুন";
            }
        });

        // ৩. লগআউট ফাংশন
        function logout() {
            if(confirm("আপনি কি আপনার মেম্বার প্যানেল থেকে লগআউট করতে চান?")) {
                localStorage.removeItem('userData');
                window.location.href = 'login.html';
            }
        }

        // পেজ রান হওয়ার সাথে সাথে প্রোফাইল ডাটা লোড হবে
        loadUserProfile();
    </script>
</body>
</html>
