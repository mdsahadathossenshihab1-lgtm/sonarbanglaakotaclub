<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>সদস্য লগইন - সোনার বাংলা একতা ক্লাব</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-2xl p-6 md:p-8 border border-slate-200">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-red-600">সোনার বাংলা একতা ক্লাব</h1>
            <p class="text-slate-500 text-sm mt-1">আপনার অ্যাকাউন্ট লগইন করুন</p>
        </div>

        <form id="loginForm" class="space-y-5">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">সদস্য ফোন নম্বর</label>
                <input type="tel" id="memberPhone" required placeholder="017XXXXXXXX" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500 transition">
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">পাসওয়ার্ড</label>
                <input type="password" id="password" required placeholder="আপনার গোপন পাসওয়ার্ড" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500 transition">
            </div>

            <button type="submit" id="loginBtn" class="w-full bg-red-600 text-white font-bold py-2.5 rounded-lg hover:bg-red-700 transition active:scale-[0.98]">লগইন করুন</button>
        </form>

        <div class="mt-6 text-center border-t pt-4">
            <a href="index.html" class="text-sm text-slate-500 hover:text-red-600 transition underline">নতুন সদস্য নিবন্ধন ফর্ম</a>
        </div>

        <div id="profileCard" class="hidden mt-6 bg-slate-50 p-5 rounded-xl border border-slate-200 text-center space-y-4">
            <div class="flex justify-center">
                <img id="userPhoto" src="" class="w-24 h-24 rounded-full object-cover border-4 border-white shadow-md bg-white" onerror="this.src='https://via.placeholder.com/150'">
            </div>
            <div>
                <h2 id="userName" class="text-xl font-bold text-slate-800"></h2>
                <p id="userBlood" class="text-red-600 font-bold text-sm mt-0.5"></p>
                <p id="userPhone" class="text-slate-500 text-xs mt-1"></p>
                <p id="userAddress" class="text-slate-600 text-sm mt-2 font-medium bg-white p-2 rounded-lg border"></p>
            </div>
            <p class="text-green-600 font-bold text-sm bg-green-50 py-1.5 rounded-lg border border-green-200">✓ আপনার অ্যাকাউন্ট সচল রয়েছে</p>
        </div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycby4wEo_INBFJvNbn8AUIbVtD0WY9exumxNdeM5Q-y5qrmVWisKgkf9ou0w0UkQ2rvSaTQ/exec';

        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const profileCard = document.getElementById('profileCard');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            loginBtn.disabled = true;
            loginBtn.innerText = "যাচাই করা হচ্ছে...";
            
            const phoneVal = document.getElementById('memberPhone').value.trim();
            const passVal = document.getElementById('password').value.trim();

            // এখানে URL-encoded ফরম্যাটে ডেটা পাঠানো হচ্ছে যাতে Apps Script সহজে পড়তে পারে
            const payload = new URLSearchParams();
            payload.append("action", "login");
            payload.append("memberPhone", phoneVal);
            payload.append("password", passVal);

            try {
                const response = await fetch(scriptURL, { 
                    method: 'POST', 
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: payload.toString() 
                });
                
                const result = await response.json();

                if (result.status === "success") {
                    alert("🎉 লগইন সফল হয়েছে!");
                    
                    loginForm.classList.add('hidden');
                    profileCard.classList.remove('hidden');

                    document.getElementById('userName').innerText = result.user.name;
                    document.getElementById('userBlood').innerText = "রক্তের গ্রুপ: " + result.user.blood;
                    document.getElementById('userPhone').innerText = "মোবাইল: " + result.user.phone;
                    document.getElementById('userAddress').innerText = "বর্তমান ঠিকানা: " + result.user.address;
                    document.getElementById('userPhoto').src = result.user.photo;

                } else {
                    alert("❌ ভুল ফোন নম্বর অথবা পাসওয়ার্ড! আবার চেষ্টা করুন।");
                }

            } catch (error) {
                console.error('Error!', error);
                alert("কারিগরি ত্রুটি হয়েছে বা ডেটা খুঁজে পাওয়া যায়নি। আপনার গুগল শিটে পাসওয়ার্ড কলামটি ফাঁকা কিনা চেক করুন।");
            } finally {
                loginBtn.disabled = false;
                loginBtn.innerText = "লগইন করুন";
            }
        });
    </script>
</body>
</html>
