<script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbz80qJzxb04BGDxXPV3QXRrCozv0OmolzwpEqsrX0EVkrJLlNG6NWjeKARrXXmx-uDUSA/exec'; // আপনার নতুন Apps Script Web App URLটি এখানে দিন
        let allMembers = [];

        async function fetchMembers() {
            try {
                const response = await fetch(scriptURL);
                allMembers = await response.json();
                renderMembers(allMembers);
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('loadingText').innerText = "ডাটা লোড করতে সমস্যা হয়েছে।";
            }
        }

        function renderMembers(data) {
            const grid = document.getElementById('memberGrid');
            const count = document.getElementById('memberCount');
            grid.innerHTML = '';
            count.innerText = data.length;

            if(data.length === 0) {
                grid.innerHTML = '<p class="col-span-full text-center py-10 text-slate-400">কোনো সদস্য পাওয়া যায়নি।</p>';
                return;
            }

            data.forEach(user => {
                // এখানে 'user.photo' ব্যবহার করা হয়েছে যা এখন Apps Script থেকে পারফেক্টলি আসবে
                grid.innerHTML += `
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1">
                        <div class="flex items-center space-x-4">
                            <img src="${user.photo}" class="w-20 h-20 rounded-full object-cover border-2 border-red-100 p-1 bg-slate-50" onerror="this.src='https://via.placeholder.com/150'">
                            <div>
                                <h3 class="font-bold text-slate-800 text-lg">${user.name}</h3>
                                <p class="text-red-600 font-bold text-sm">${user.blood} রক্তের গ্রুপ</p>
                                <p class="text-slate-500 text-xs">${user.phone}</p>
                            </div>
                        </div>
                        <button onclick="viewDetails('${user.phone}')" class="w-full mt-5 bg-slate-50 text-slate-700 font-bold py-2 rounded-xl border border-slate-200 hover:bg-red-600 hover:text-white hover:border-red-600 transition-colors">View Full Details</button>
                    </div>
                `;
            });
        }

        function viewDetails(phone) {
            // ফোন নম্বর ম্যাচ করিয়ে নির্দিষ্ট মেম্বারকে খুঁজে বের করা
            const user = allMembers.find(u => u.phone.toString().trim() === phone.toString().trim());
            if(!user) return;

            const modalBody = document.getElementById('modalBody');
            modalBody.innerHTML = `
                <div class="flex flex-col md:flex-row gap-8 items-center md:items-start">
                    <img src="${user.photo}" class="w-40 h-40 rounded-2xl object-cover shadow-lg border-4 border-slate-100" onerror="this.src='https://via.placeholder.com/150'">
                    <div class="flex-1 space-y-3 w-full">
                        <div class="bg-slate-50 p-3 rounded-lg"><p class="text-xs text-slate-500">সদস্যের নাম</p><p class="font-bold text-lg text-slate-800">${user.name}</p></div>
                        <div class="bg-red-50 p-3 rounded-lg"><p class="text-sm text-red-600">রক্তের গ্রুপ</p><p class="font-bold text-lg text-red-600">${user.blood}</p></div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div><p class="text-xs text-slate-500">মোবাইল নম্বর</p><p class="font-semibold text-slate-800">${user.phone}</p></div>
                            <div><p class="text-xs text-slate-500">বর্তমান ঠিকানা</p><p class="font-semibold text-slate-800">${user.address}</p></div>
                        </div>
                        <hr class="my-2">
                        <div class="p-3 bg-slate-50 rounded-lg">
                           <p class="text-xs text-slate-500 mb-1">নিবন্ধন আইডি</p>
                           <p class="font-mono text-sm text-slate-700">MBR-ID-${user.phone.slice(-4)}</p>
                        </div>
                    </div>
                </div>
            `;
            toggleModal();
        }

        function toggleModal() {
            const modal = document.getElementById('modal');
            modal.classList.toggle('opacity-0');
            modal.classList.toggle('pointer-events-none');
            document.body.classList.toggle('modal-active');
        }

        function searchMembers() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allMembers.filter(u => 
                u.name.toLowerCase().includes(term) || 
                u.phone.toString().includes(term)
            );
            renderMembers(filtered);
        }

        // পেজ লোড হলে ডাটা ফেচ করা শুরু করবে
        fetchMembers();
    </script>
