<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>লগইন - সোনার বাংলা একতা ক্লাব</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Hind Siliguri', sans-serif; }</style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 border border-slate-200">
        <div class="text-center mb-8">
            <h2 class="text-2xl font-bold text-red-600">মেম্বার লগইন</h2>
            <p class="text-slate-500">আপনার তথ্য দেখতে নম্বর ও পাসওয়ার্ড দিন</p>
        </div>
        <form id="loginForm" class="space-y-5">
            <input type="hidden" name="action" value="login">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">মোবাইল নম্বর</label>
                <input type="tel" name="memberPhone" required placeholder="017XXXXXXXX" class="w-full px-4 py-2.5 border rounded-lg focus:ring-2 focus:ring-red-500 outline-none">
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">পাসওয়ার্ড</label>
                <input type="password" name="password" required placeholder="******" class="w-full px-4 py-2.5 border rounded-lg focus:ring-2 focus:ring-red-500 outline-none">
            </div>
            <button type="submit" id="loginBtn" class="w-full bg-red-600 text-white font-bold py-3 rounded-lg hover:bg-red-700 transition shadow-md">লগইন করুন</button>
        </form>
        <div class="mt-6 text-center">
            <a href="index.html" class="text-blue-600 text-sm hover:underline">নতুন মেম্বার? এখানে নিবন্ধন করুন</a>
        </div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbyiPjmLGfEnIN-iGTgbMPLgK3U2c4Ws6DsMbTFxmXHS4jveJlJAYqg6eZ-qNlUM6sKO-A/exec';
        const form = document.getElementById('loginForm');

        form.addEventListener('submit', e => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            btn.innerText = "যাচাই করা হচ্ছে...";
            btn.disabled = true;

            fetch(scriptURL, { method: 'POST', body: new FormData(form)})
            .then(res => res.json())
            .then(data => {
                if(data.status === "success") {
                    localStorage.setItem('userData', JSON.stringify(data.user));
                    window.location.href = 'profile.html';
                } else {
                    alert("ভুল নম্বর অথবা পাসওয়ার্ড!");
                    btn.innerText = "লগইন করুন";
                    btn.disabled = false;
                }
            })
            .catch(error => {
                console.error('Error!', error.message);
                alert("সার্ভারে সমস্যা হচ্ছে!");
                btn.disabled = false;
            });
        });
    </script>
</body>
</html>
