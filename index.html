<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>সদস্য নিবন্ধন - সোনার বাংলা একতা ক্লাব</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen py-12 px-4">
    <div class="max-w-3xl mx-auto bg-white rounded-2xl shadow-2xl overflow-hidden border border-slate-200">
        
        <div class="bg-gradient-to-r from-red-600 to-rose-600 p-8 text-center text-white relative">
            <h1 class="text-3xl font-bold mb-2">সোনার বাংলা একতা ক্লাব</h1>
            <p class="text-red-100 text-base">অফিসিয়াল সদস্যপদ আবেদন এবং নিবন্ধন ফর্ম</p>
            
            <!-- লগইন বাটন (যদি আগে থেকেই মেম্বার থাকে) -->
            <div class="mt-4">
                <a href="login.html" class="inline-block bg-white text-red-600 px-4 py-1.5 rounded-full text-sm font-bold shadow-md hover:bg-red-50 transition">আমার অলরেডি তথ্য সাবমিট করা আছে</a>
            </div>
        </div>

        <form id="advancedRegistrationForm" class="p-6 md:p-10 space-y-8">
            
            <!-- হিডেন অ্যাকশন ফিল্ড -->
            <input type="hidden" name="action" value="register">

            <div>
                <h2 class="text-xl font-bold text-slate-800 mb-4 pb-2 border-b-2 border-red-500 flex items-center">
                    <span class="bg-red-600 text-white rounded-full w-6 h-6 inline-flex items-center justify-center text-sm mr-2">১</span>
                    ব্যক্তিগত তথ্য (Personal Information)
                </h2>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">সদস্যের নাম (বাংলায়) <span class="text-red-500">*</span></label>
                        <input type="text" name="nameBn" required placeholder="উদা: সাহাদাত হোসেন" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500 transition">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">সদস্যের নাম (ইংরেজিতে) <span class="text-red-500">*</span></label>
                        <input type="text" name="nameEn" required placeholder="Ex: Sahadat Hossen" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500 transition">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">পিতার নাম <span class="text-red-500">*</span></label>
                        <input type="text" name="fatherName" required placeholder="পিতার পুরো নাম লিখুন" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500 transition">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">মাতার নাম <span class="text-red-500">*</span></label>
                        <input type="text" name="motherName" required placeholder="মাতার পুরো নাম লিখুন" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500 transition">
                    </div>
                </div>
            </div>

            <!-- নতুন সেকশন: লগইন তথ্য (পাসওয়ার্ড) -->
            <div>
                <h2 class="text-xl font-bold text-slate-800 mb-4 pb-2 border-b-2 border-red-500 flex items-center">
                    <span class="bg-red-600 text-white rounded-full w-6 h-6 inline-flex items-center justify-center text-sm mr-2">২</span>
                    লগইন তথ্য (সুরক্ষার জন্য)
                </h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">সদস্যের ফোন নম্বর <span class="text-red-500">*</span></label>
                        <input type="tel" name="memberPhone" required placeholder="017XXXXXXXX" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500 transition">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">পাসওয়ার্ড সেট করুন (৬-৮ অক্ষর) <span class="text-red-500">*</span></label>
                        <input type="password" name="password" required placeholder="পাসওয়ার্ড লিখুন" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500 transition">
                    </div>
                </div>
            </div>

            <div>
                <h2 class="text-xl font-bold text-slate-800 mb-4 pb-2 border-b-2 border-red-500 flex items-center">
                    <span class="bg-red-600 text-white rounded-full w-6 h-6 inline-flex items-center justify-center text-sm mr-2">৩</span>
                    অন্যান্য বিবরণী
                </h2>
                
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">জন্ম তারিখ <span class="text-red-500">*</span></label>
                        <input type="date" name="dob" required class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500 transition">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">ধর্ম <span class="text-red-500">*</span></label>
                        <select name="religion" required class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500 bg-white transition">
                            <option value="" disabled selected>নির্বাচন করুন</option>
                            <option value="ইসলাম">ইসলাম</option>
                            <option value="সনাতন (হিন্দু)">সনাতন (হিন্দু)</option>
                            <option value="বৌদ্ধ">বৌদ্ধ</option>
                            <option value="খ্রিস্টান">খ্রিস্টান</option>
                            <option value="অন্যান্য">অন্যান্য</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">জাতীয়তা <span class="text-red-500">*</span></label>
                        <input type="text" name="nationality" value="বাংলাদেশী" required class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500 transition">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">রক্তের গ্রুপ <span class="text-red-500">*</span></label>
                        <select name="bloodGroup" required class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500 bg-white transition">
                            <option value="" disabled selected>নির্বাচন করুন</option>
                            <option value="A+">A+</option><option value="A-">A-</option>
                            <option value="B+">B+</option><option value="B-">B-</option>
                            <option value="O+">O+</option><option value="O-">O-</option>
                            <option value="AB+">AB+</option><option value="AB-">AB-</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">উচ্চতা <span class="text-red-500">*</span></label>
                        <input type="text" name="height" required placeholder="উদা: ৫ ফুট ৪ ইঞ্চি" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500 transition">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">ID নম্বর (NID/পাসপোর্ট) <span class="text-red-500">*</span></label>
                        <input type="text" name="docIdNumber" required placeholder="নম্বরটি টাইপ করুন" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500 transition">
                    </div>
                </div>
            </div>

            <div>
                <h2 class="text-xl font-bold text-slate-800 mb-4 pb-2 border-b-2 border-red-500 flex items-center">
                    <span class="bg-red-600 text-white rounded-full w-6 h-6 inline-flex items-center justify-center text-sm mr-2">৪</span>
                    ঠিকানা ও ডকুমেন্টস
                </h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">বর্তমান ঠিকানা <span class="text-red-500">*</span></label>
                        <textarea name="presentAddress" rows="2" required placeholder="গ্রাম, ডাকঘর, থানা, জেলা" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500 transition resize-none"></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">স্থায়ী ঠিকানা <span class="text-red-500">*</span></label>
                        <textarea name="permanentAddress" rows="2" required placeholder="গ্রাম, ডাকঘর, থানা, জেলা" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500 transition resize-none"></textarea>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">পাসপোর্ট সাইজের ছবি <span class="text-red-500">*</span></label>
                        <input type="file" id="photoFileInput" accept="image/*" required class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-slate-50 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">NID/জন্ম সনদের ছবি <span class="text-red-500">*</span></label>
                        <input type="file" id="docFileInput" accept="image/*" required class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-slate-50 focus:outline-none">
                    </div>
                </div>
            </div>

            <div class="bg-slate-50 p-6 rounded-xl border border-slate-200">
                <h2 class="text-lg font-bold text-slate-800 mb-4 flex items-center text-red-600">📋 ঘোষণা পত্র</h2>
                <div class="space-y-4">
                    <label class="flex items-start p-3 bg-white border border-gray-200 rounded-lg cursor-pointer hover:bg-red-50/30 transition">
                        <input type="checkbox" name="rule1" required class="mt-1 text-red-600 h-4 w-4 rounded">
                        <span class="ml-3 text-sm text-gray-700">আমি ক্লাবের সকল নিয়ম ও শৃঙ্খলা মেনে চলতে বাধ্য থাকবো। <span class="text-red-500">*</span></span>
                    </label>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">পূর্ণ নাম (স্বাক্ষর হিসেবে) <span class="text-red-500">*</span></label>
                    <input type="text" name="signatureName" required class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500 transition font-medium">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">আজকের তারিখ <span class="text-red-500">*</span></label>
                    <input type="date" name="joiningDate" required class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500 transition">
                </div>
            </div>

            <div class="pt-4">
                <button type="submit" id="submitBtn" class="w-full bg-gradient-to-r from-red-600 to-rose-600 text-white font-bold py-3.5 rounded-xl shadow-lg hover:from-red-700 hover:to-rose-700 transition active:scale-[0.98] text-lg">নিবন্ধন সম্পন্ন করুন</button>
            </div>
            
            <p id="msg" class="text-center font-semibold text-green-600 mt-4 hidden bg-green-50 py-3 rounded-lg border border-green-200"></p>
        </form>

        <div class="p-6 bg-slate-50 border-t border-slate-200 text-center">
            <a href="admin.html" class="text-slate-500 text-sm hover:text-red-600 transition underline">অ্যাডমিন লগইন (ক্লাব কর্তৃপক্ষ)</a>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
